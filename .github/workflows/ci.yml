name: CI

on:
  pull_request:
  push:
    branches: [main]

# Both jobs run on every PR with no `paths:` filter. That is deliberate: a
# required status check that is skipped never reports back, which leaves the
# PR permanently unmergeable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check src

      - name: Format (ruff)
        run: poetry run ruff format --check src

      - name: Types (pyright)
        run: poetry run pyright

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format (biome)
        run: npm run check

      - name: Types (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build
